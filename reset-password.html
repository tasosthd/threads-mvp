<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password · Loom Threads</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-body" data-auth="reset-password">
  <main class="auth-card">
    <div class="auth-top">
      <a class="logo-lockup" href="login.html"><img src="assets/img/logo.svg" alt="Loom Threads logo"><span>Loom</span></a>
      <button class="theme-mini" id="themeMini" type="button">Theme</button>
    </div>
    <h1>New password.</h1>
    <p>Create a strong new password after opening the secure reset link from your email.</p>
    <div class="error-box" id="authError" hidden></div>
    <form class="form-stack" id="resetPasswordForm">
      <label>New password
        <span class="password-wrap">
          <input id="newPassword" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
          <button type="button" data-toggle-password="#newPassword">Show</button>
        </span>
      </label>
      <label>Confirm new password
        <span class="password-wrap">
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat new password" minlength="8" required>
          <button type="button" data-toggle-password="#confirmPassword">Show</button>
        </span>
      </label>
      <button class="primary-btn" type="submit">Update password</button>
    </form>
    <p class="auth-switch">Need a new link? <a href="forgot-password.html">Send reset email</a></p>
  </main>
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
