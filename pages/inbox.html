<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox · Loom Threads</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-page="inbox">
  <div class="app-shell" id="appShell">
    <main class="main-view">
      <header class="page-head">
        <h1>Inbox</h1>
        <p>Your Supabase conversations, unread messages, and fast DM launchpad.</p>
      </header>

      <section class="dm-layout">
        <div class="dm-panel">
          <div class="section-title">
            <span>
              <strong>Conversations</strong>
              <small>Tap a user to open the full chat.</small>
            </span>
          </div>
          <section class="feed-stack" id="inboxList"></section>
        </div>

        <aside class="dm-panel new-message-panel">
          <div class="section-title">
            <span>
              <strong>Start a message</strong>
              <small>Search Supabase users and open a DM.</small>
            </span>
          </div>
          <label class="search-box compact-search">
            <input id="newMessageSearch" type="search" placeholder="Search people..." autocomplete="off">
          </label>
          <section class="feed-stack" id="newMessageUsers"></section>
        </aside>
      </section>
    </main>
  </div>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
