<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox · Loom Threads</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-page="inbox">
  <div class="app-shell" id="appShell">
    <main class="main-view">
      <header class="page-head"><h1>Inbox</h1><p>Simple local messages for MVP testing.</p></header>
      <form class="settings-card card" id="messageForm">
        <label>Send to
          <select id="recipient" name="recipient"></select>
        </label>
        <label>Message
          <input name="message" placeholder="Write a message..." autocomplete="off" required>
        </label>
        <div class="form-actions"><button class="primary-btn" type="submit">Send message</button></div>
      </form>
      <section class="feed-stack" id="inboxList" style="margin-top:12px"></section>
    </main>
  </div>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
