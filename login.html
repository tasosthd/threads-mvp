<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Loom Threads</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-body" data-auth="login">
  <main class="auth-card">
    <div class="auth-top">
      <a class="logo-lockup" href="login.html"><img src="assets/img/logo.svg" alt="Loom Threads logo"><span>Loom</span></a>
      <button class="theme-mini" id="themeMini" type="button">Theme</button>
    </div>
    <h1>Welcome back.</h1>
    <p>Login with email or username. No OAuth. Powered by your Supabase Auth setup.</p>
    <div class="error-box" id="authError" hidden></div>
    <form class="form-stack" id="loginForm">
      <label>Email or username
        <input name="login" autocomplete="username" placeholder="alex or alex@demo.com" required>
      </label>
      <label>Password
        <span class="password-wrap">
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="password123" required>
          <button type="button" data-toggle-password="#loginPassword">Show</button>
        </span>
      </label>
      <div class="auth-row">
        <label class="check-line"><input type="checkbox" name="remember" checked> Remember me on this device</label>
        <a class="forgot-link" href="forgot-password.html">Forgot password?</a>
      </div>
      <button class="primary-btn" type="submit">Login</button>
    </form>
    <p class="auth-switch">No account yet? <a href="signup.html">Create one</a></p>
  </main>
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
