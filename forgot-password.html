<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password · Loom Threads</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-body" data-auth="forgot-password">
  <main class="auth-card">
    <div class="auth-top">
      <a class="logo-lockup" href="login.html"><img src="assets/img/logo.svg" alt="Loom Threads logo"><span>Loom</span></a>
      <button class="theme-mini" id="themeMini" type="button">Theme</button>
    </div>
    <h1>Reset access.</h1>
    <p>Enter your account email and Supabase will send a secure password reset link. Clean, simple, founder-grade.</p>
    <div class="error-box" id="authError" hidden></div>
    <form class="form-stack" id="forgotPasswordForm">
      <label>Email address
        <input name="email" type="email" autocomplete="email" placeholder="alex@demo.com" required>
      </label>
      <button class="primary-btn" type="submit">Send reset link</button>
    </form>
    <p class="auth-switch">Remembered it? <a href="login.html">Back to login</a></p>
  </main>
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
